name: CompatHelper

on:
  pull_request:
  schedule:
    # Run weekly (Sunday at midnight UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/julia-compathelper@v1
